name: Portal dependency check

on:
  pull_request:
  push:
    branches: [main, 'emberweb/**']

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --filter ember-web-client-workspace audit --prod --audit-level high
